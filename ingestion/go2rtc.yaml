# ==============================================================================
# go2rtc Configuration for Workforce Vision Platform
# Zero hardcoded passwords or static RTSP credentials.
# All streams are registered and managed dynamically by core-api via REST API.
# ==============================================================================
log:
  level: info

api:
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"

# Empty streams object: dynamically populated by core-api at runtime
streams: {}
